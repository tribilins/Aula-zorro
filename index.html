<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FF7C40">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Aula Zorro">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
<title>Aula Zorro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: cuaderno de cuadrícula — barra lateral fija (escritorio) / barra inferior (teléfono), área de trabajo en tarjetas de papel */
:root{
  --paper:#F4F5EF; --paper-2:#E9ECE3; --card:#FFFFFF; --ink:#17223A; --ink-2:#4B566E; --ink-3:#7A8398;
  --line:#D7DBCF; --grid:rgba(43,93,170,.075);
  --fox:#D4531A; --fox-ink:#FFFFFF; --fox-soft:#FBE4D6;
  --sky:#2B5DAA; --sky-soft:#DDE7F6; --leaf:#2E7A4D; --leaf-soft:#DCEFE2;
  --warn:#A96A12; --warn-soft:#F8EBD0; --bad:#B42318; --bad-soft:#F8DEDB;
  --shadow:0 1px 0 rgba(23,34,58,.04),0 8px 24px -12px rgba(23,34,58,.18);
  --f-display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible','Segoe UI',system-ui,-apple-system,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:12px; --nav-w:236px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11151D; --paper-2:#181E29; --card:#1B2230; --ink:#E8EBF2; --ink-2:#A7B0C3; --ink-3:#7C869B;
  --line:#2B3446; --grid:rgba(140,175,240,.05);
  --fox:#FF7C40; --fox-ink:#1A0E07; --fox-soft:#3A2317;
  --sky:#86ACEB; --sky-soft:#1B2842; --leaf:#62C58E; --leaf-soft:#16301F;
  --warn:#E3AB4E; --warn-soft:#33270F; --bad:#F2786C; --bad-soft:#3B1B18;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#11151D; --paper-2:#181E29; --card:#1B2230; --ink:#E8EBF2; --ink-2:#A7B0C3; --ink-3:#7C869B;
  --line:#2B3446; --grid:rgba(140,175,240,.05);
  --fox:#FF7C40; --fox-ink:#1A0E07; --fox-soft:#3A2317;
  --sky:#86ACEB; --sky-soft:#1B2842; --leaf:#62C58E; --leaf-soft:#16301F;
  --warn:#E3AB4E; --warn-soft:#33270F; --bad:#F2786C; --bad-soft:#3B1B18;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background-color:var(--paper);color:var(--ink);font:16px/1.55 var(--f-body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em}
:focus-visible{outline:2.5px solid var(--fox);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono)}
.tab{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--nav-w) minmax(0,1fr);min-height:100%}
.nav{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:4px;
  padding:22px 14px;border-right:1px solid var(--line);background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(6px)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.brand svg{flex:none}
.brand b{font:800 21px/1 var(--f-display);letter-spacing:-.02em}
.brand small{display:block;font:600 10.5px/1.3 var(--f-mono);color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:10px 12px;border-radius:10px;cursor:pointer;
  color:var(--ink-2);font-weight:700;font-size:15px;text-align:left}
.nav button svg{width:20px;height:20px;flex:none}
.nav button:hover{background:var(--paper-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--ink);color:var(--paper)}
.nav .foot{margin-top:auto;padding:12px;font-size:12.5px;color:var(--ink-3);border-top:1px dashed var(--line)}
.nav .foot b{color:var(--ink-2)}
main{min-width:0;padding-inline:clamp(16px,3.5vw,44px);padding-block:26px 60px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .nav{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;justify-content:space-around;gap:0;z-index:40;
    padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);background:var(--paper)}
  .brand,.nav .foot{display:none}
  .nav button{flex-direction:column;gap:3px;font-size:10.5px;padding:6px 4px;flex:1;min-width:0;align-items:center}
  .nav button[aria-current="page"]{background:var(--fox-soft);color:var(--fox)}
  main{padding-block:18px 96px}
}

/* ---------- primitives ---------- */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font:600 11.5px/1 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.h1{font-size:clamp(28px,4.2vw,42px);font-weight:800;margin-top:8px}
.h1 em{font-style:normal;color:var(--fox)}
.sub{color:var(--ink-2);margin:6px 0 0;max-width:62ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}
.sec-t{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sec-t h2{font-size:20px;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);
  padding:9px 14px;border-radius:10px;font-weight:700;font-size:14.5px;cursor:pointer;white-space:nowrap;min-height:40px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--fox);border-color:var(--fox);color:var(--fox-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--paper-2)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:6px 10px;min-height:32px;font-size:13px;border-radius:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font:600 12px/1.5 var(--f-body);background:var(--paper-2);color:var(--ink-2);white-space:nowrap}
.chip.fox{background:var(--fox-soft);color:var(--fox)} .chip.sky{background:var(--sky-soft);color:var(--sky)}
.chip.leaf{background:var(--leaf-soft);color:var(--leaf)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.dot::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.seg{display:inline-flex;background:var(--paper-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:700;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
label.f{display:flex;flex-direction:column;gap:5px;font-weight:700;font-size:13.5px;color:var(--ink-2);min-width:0}
label.f span.hint{font-weight:400;color:var(--ink-3);font-size:12.5px}
.in{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 11px;min-height:42px;color:var(--ink);font-weight:400;font-size:15px}
.in:focus{outline:none;border-color:var(--fox);box-shadow:0 0 0 3px var(--fox-soft)}
textarea.in{resize:vertical;min-height:84px;line-height:1.45}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.grid2{grid-template-columns:minmax(0,1fr)}}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;color:var(--ink-2);background:color-mix(in srgb,var(--card) 60%,transparent)}
.empty b{display:block;font:700 17px/1.3 var(--f-display);color:var(--ink);margin-bottom:4px}
.muted{color:var(--ink-3)}
.badge{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;font:700 13px/1 var(--f-mono);flex:none;letter-spacing:.02em}

/* ---------- inicio ---------- */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{padding:14px 16px}
.stat .n{font:800 30px/1 var(--f-display);font-variant-numeric:tabular-nums;margin-top:8px}
.stat .l{font-size:13px;color:var(--ink-2)}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.gcard{padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);position:relative;overflow:hidden}
.gcard:hover{border-color:var(--fox)}
.gcard .gname{font:800 34px/1 var(--f-display);letter-spacing:-.03em}
.gcard .gname small{font:600 13px var(--f-body);color:var(--ink-3);letter-spacing:0;margin-left:6px}
.gcard .meta{display:flex;gap:14px;font-size:13px;color:var(--ink-2)}
.gcard .meta b{display:block;font:700 18px/1.1 var(--f-display);color:var(--ink);font-variant-numeric:tabular-nums}
.gcard::after{content:"";position:absolute;right:-18px;top:-18px;width:74px;height:74px;border-radius:50%;background:var(--gc,var(--fox-soft));opacity:.9}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.qbtn{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);background:var(--card);border-radius:var(--r);cursor:pointer;text-align:left}
.qbtn:hover{border-color:var(--fox);transform:translateY(-1px)}
.qbtn b{display:block;font-size:15px} .qbtn span{font-size:12.5px;color:var(--ink-2)}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px}
@media (max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer;min-width:0;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li:hover .t{color:var(--fox)}
.li .t{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .m{font-size:12.5px;color:var(--ink-3)}
.li .grow{flex:1;min-width:0;display:flex;flex-direction:column}

/* ---------- crear ---------- */
.studio{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:980px){.studio{grid-template-columns:minmax(0,1fr)}}
.tools{display:flex;flex-direction:column;gap:6px}
@media (max-width:980px){.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
.tool{display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px;border:1px solid transparent;background:none;cursor:pointer;text-align:left}
.tool b{display:block;font-size:14.5px;line-height:1.25} .tool span{font-size:12px;color:var(--ink-3);line-height:1.3;display:block}
.tool:hover{background:var(--paper-2)}
.tool[aria-pressed="true"]{background:var(--card);border-color:var(--fox);box-shadow:var(--shadow)}
.form{display:flex;flex-direction:column;gap:12px}
.out{margin-top:4px}
.outbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.status{font:600 12.5px var(--f-mono);color:var(--ink-3);display:flex;align-items:center;gap:8px}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--fox);animation:pl 1.1s infinite}
@keyframes pl{50%{opacity:.25}}
.doc{padding:18px 22px 24px;max-width:78ch;overflow-wrap:anywhere}
.doc h1{font-size:26px;margin:.2em 0 .5em} .doc h2{font-size:20px;margin:1.4em 0 .5em;padding-bottom:4px;border-bottom:2px solid var(--fox-soft)}
.doc h3{font-size:16.5px;margin:1.2em 0 .4em}
.doc p,.doc li{max-width:70ch} .doc ul,.doc ol{padding-left:1.3em}
.doc table{border-collapse:collapse;width:100%;font-size:14px;margin:10px 0}
.doc .tw{overflow-x:auto;margin:10px 0}
.doc th,.doc td{border:1px solid var(--line);padding:7px 9px;vertical-align:top;text-align:left}
.doc th{background:var(--paper-2);font-weight:700}
.doc code{font-family:var(--f-mono);font-size:.9em;background:var(--paper-2);padding:1px 5px;border-radius:5px}
.doc blockquote{margin:10px 0;padding:8px 14px;border-left:3px solid var(--sky);background:var(--sky-soft);border-radius:0 8px 8px 0}
.doc hr{border:0;border-top:1px dashed var(--line);margin:18px 0}
.quizprev{display:flex;flex-direction:column;gap:12px;padding:18px 22px}
.qitem{padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
.qitem .qn{font:600 11.5px var(--f-mono);color:var(--fox);letter-spacing:.06em}
.qitem .opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:8px}
@media (max-width:560px){.qitem .opts{grid-template-columns:minmax(0,1fr)}}
.qitem .opt{font-size:14px;padding:6px 9px;border-radius:8px;background:var(--card);border:1px solid var(--line)}
.qitem .opt.ok{border-color:var(--leaf);background:var(--leaf-soft);color:var(--leaf);font-weight:700}
.err{padding:12px 14px;border-radius:10px;background:var(--bad-soft);color:var(--bad);font-weight:700;font-size:14px}
.note{padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:14px}

/* ---------- biblioteca ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar .in{max-width:340px}

/* ---------- grupos ---------- */
.gtabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.gtab{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 14px;cursor:pointer;text-align:left;flex:none}
.gtab b{font:800 20px/1 var(--f-display);display:block}
.gtab span{font-size:12px;color:var(--ink-3)}
.gtab[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.gtab[aria-pressed="true"] span{color:color-mix(in srgb,var(--paper) 70%,transparent)}
.roster{display:flex;flex-direction:column}
.stu{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line)}
.stu:last-child{border-bottom:0}
.stu .num{font:600 12.5px var(--f-mono);color:var(--ink-3);text-align:right}
.stu .nm{font-weight:700;min-width:0;overflow-wrap:anywhere}
.att{display:inline-flex;gap:4px}
.att button{width:38px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--paper);font:700 13px var(--f-mono);cursor:pointer;color:var(--ink-3)}
.att button[aria-pressed="true"][data-v="P"]{background:var(--leaf-soft);border-color:var(--leaf);color:var(--leaf)}
.att button[aria-pressed="true"][data-v="R"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.att button[aria-pressed="true"][data-v="A"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.gradewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.grades{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
table.grades th,table.grades td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
table.grades th{background:var(--paper-2);font-size:12.5px;color:var(--ink-2)}
table.grades th small{display:block;font:600 11px var(--f-mono);color:var(--ink-3)}
table.grades td:first-child,table.grades th:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1}
table.grades th:first-child{background:var(--paper-2)}
table.grades input{width:58px;text-align:center;border:1px solid transparent;background:var(--paper);border-radius:7px;padding:5px 2px;font-variant-numeric:tabular-nums}
table.grades input:focus{outline:none;border-color:var(--fox)}
.avg{font:700 15px var(--f-mono);padding:3px 8px;border-radius:7px}
.avg.hi{background:var(--leaf-soft);color:var(--leaf)} .avg.md{background:var(--warn-soft);color:var(--warn)} .avg.lo{background:var(--bad-soft);color:var(--bad)}
.dyn{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}

/* ---------- corregir ---------- */
.score{display:flex;gap:16px;align-items:center;padding:18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.score .big{font:800 56px/1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--fox)}
.fb{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:18px}
@media (max-width:700px){.fb{grid-template-columns:minmax(0,1fr)}}
.fb h3{font-size:15px;margin-bottom:6px}
.fb ul{margin:0;padding-left:1.1em}
.fix{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;font-size:14px;padding:8px 0;border-bottom:1px dashed var(--line)}
.fix s{color:var(--bad)} .fix ins{color:var(--leaf);text-decoration:none;font-weight:700}
.fix small{grid-column:1/-1;color:var(--ink-3)}

/* ---------- chat ---------- */
.chat{display:flex;flex-direction:column;gap:12px;min-height:320px}
.msg{max-width:min(78ch,92%);padding:12px 14px;border-radius:14px;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--paper);border-bottom-right-radius:4px;white-space:pre-wrap}
.msg.ai{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.ai .doc{padding:0}
.composer{display:flex;gap:8px;align-items:flex-end;position:sticky;bottom:10px}
@media (max-width:820px){.composer{bottom:78px}}
.composer textarea{min-height:48px;max-height:180px}

/* ---------- modal & stage ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,14,22,.5);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto}
.modal{width:min(860px,100%);background:var(--card);border-radius:16px;border:1px solid var(--line);box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
.mhead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.mhead h2{font-size:22px}
.mfoot{display:flex;flex-wrap:wrap;gap:8px;padding:14px 20px;border-top:1px solid var(--line)}
.stage{position:fixed;inset:0;z-index:70;background:var(--ink);color:var(--paper);display:flex;flex-direction:column;
  padding:calc(14px + env(safe-area-inset-top,0px)) clamp(16px,4vw,48px) calc(16px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.stage .top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stage .top .t{font:600 13px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.stage .sbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:inherit;border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer;min-height:40px}
.stage .sbtn:hover{background:rgba(255,255,255,.16)}

<script>
(function(){
"use strict";
/* ================= utilidades ================= */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID().replace(/-/g,"").slice(0,16) : Date.now().toString(36)+Math.random().toString(36).slice(2,8));
const todayISO = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const fmtDate = ts => new Date(ts).toLocaleDateString("es-MX",{day:"numeric",month:"short"});
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
function md(text){
  const t = String(text||"");
  let html;
  try{ html = window.marked ? window.marked.parse(t,{gfm:true,breaks:false}) : null; }catch(e){ html=null; }
  if(html==null) html = "<p>"+esc(t).replace(/\n\n+/g,"</p><p>").replace(/\n/g,"<br>")+"</p>";
  html = window.DOMPurify ? window.DOMPurify.sanitize(html) : (window.marked ? esc(t).replace(/\n/g,"<br>") : html);
  return html.replace(/<table>/g,'<div class="tw"><table>').replace(/<\/table>/g,"</table></div>");
}
let toastT;
function toast(msg){ const r=$("#toastRoot"); r.innerHTML='<div class="toast" role="status">'+esc(msg)+'</div>'; clearTimeout(toastT); toastT=setTimeout(()=>r.innerHTML="",2800); }
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); toast("Copiado"); }
  catch(e){ const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy"); toast("Copiado");}catch(_){toast("Selecciona y copia el texto manualmente");} ta.remove(); }
}
const LS_KEY="aulazorro.v1";
const ls = { get(k,d){ try{ const v=localStorage.getItem(LS_KEY+"."+k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
             set(k,v){ try{ localStorage.setItem(LS_KEY+"."+k,JSON.stringify(v)); }catch(e){} } };

/* ================= catálogo ================= */
const TYPES = {
  plan:{abbr:"PL", name:"Planeación de sesión", c:"fox"},
  proyecto:{abbr:"PY", name:"Proyecto NEM", c:"sky"},
  examen:{abbr:"EX", name:"Examen interactivo", c:"bad"},
  hoja:{abbr:"HT", name:"Hoja de trabajo", c:"leaf"},
  rubrica:{abbr:"RB", name:"Rúbrica analítica", c:"warn"},
  lectura:{abbr:"LC", name:"Lectura graduada", c:"sky"},
  vocab:{abbr:"VB", name:"Vocabulario bilingüe", c:"leaf"},
  padres:{abbr:"MP", name:"Mensaje a padres", c:"fox"},
  retro:{abbr:"RT", name:"Retroalimentación", c:"warn"},
  libre:{abbr:"LB", name:"Petición libre", c:"sky"},
  nota:{abbr:"NT", name:"Nota", c:""}
};
const badge = t => { const T=TYPES[t]||TYPES.nota; return '<span class="badge" style="background:var(--'+(T.c||"paper-2")+'-soft,var(--paper-2));color:var(--'+(T.c||"ink-2")+',var(--ink-2))">'+T.abbr+'</span>'; };

const TOOLS = [
  {id:"libre", desc:"Pide lo que quieras, con o sin material de apoyo", fields:["grupo","peticion","idioma"]},
  {id:"plan", desc:"Inicio, desarrollo y cierre con tiempos, PDA y evaluación formativa", fields:["grupo","materia","tema","pda","duracion","idioma","notas"]},
  {id:"proyecto", desc:"Secuencia por fases metodológicas con producto final", fields:["grupo","materia","tema","pda","sesiones","metodologia","notas"]},
  {id:"examen", desc:"Opción múltiple con clave, listo para proyectar en Modo clase", fields:["grupo","materia","tema","nivel","numQ","idioma","notas"], json:true},
  {id:"hoja", desc:"Ejercicios graduados para el alumno con hoja de respuestas", fields:["grupo","materia","tema","nivel","numQ","idioma","notas"]},
  {id:"rubrica", desc:"Criterios × 4 niveles de desempeño con descriptores", fields:["grupo","materia","tema","pda","notas"]},
  {id:"lectura", desc:"Texto adaptado al nivel MCER con glosario y preguntas", fields:["grupo","tema","nivel","idioma","notas"]},
  {id:"vocab", desc:"Tabla palabra · pronunciación · significado · ejemplo", fields:["grupo","tema","nivel","numQ","notas"]},
  {id:"padres", desc:"Aviso claro y cordial para familias, listo para WhatsApp", fields:["grupo","tema","notas"]}
];
const METOD = ["Aprendizaje basado en proyectos comunitarios","Aprendizaje basado en indagación (STEAM)","Aprendizaje basado en problemas","Aprendizaje servicio"];
const EX_Q = {examen:10, hoja:8, vocab:15};

/* ================= estado ================= */
const S = {
  materials:[], groups:[], attendance:[], grades:[], files:[],
  up:[], upCat: ls.get("upCat","Planeaciones"), upGrp:"", fq:"", fcat:"all", fgrp:"", fselMode:false, fsel:new Set(), usage:null,
  src: ls.get("src",[]), chatSrc: [], pr:null, canImg:false, imgMax:0,
  loaded:false, mode:"local",
  view: ls.get("view","inicio"),
  tool: ls.get("tool","plan"),
  form: Object.assign({grupo:"",materia:"Inglés",tema:"",pda:"",duracion:"50 min",sesiones:5,metodologia:METOD[0],nivel:"A2",numQ:10,idioma:"Bilingüe (línea por línea)",notas:""}, ls.get("form",{})),
  gen: null,
  gSel: ls.get("gSel",""), gTab: "alumnos", attDate: todayISO(),
  libQ:"", libT:"all",
  chat: [], chatBusy:false,
  fix: {tarea:"",criterios:"",trabajo:"",nivel:"A2",alumno:"",img:null}, fixOut:null, fixBusy:false
};
let db=null, sample=null, downloads=null, assets=null, ctl=null;
const inClaude = !!(window.claude && window.claude.use);

/* ================= almacenamiento (db o local) ================= */
const COLS=["materials","groups","attendance","grades","files"];
function localLoad(){ const d=ls.get("data",null); if(d){ COLS.forEach(c=>S[c]=d[c]||[]); } else { S.groups = defaultGroups(); } S.loaded=true; }
function localSave(){ if(S.mode==="local") ls.set("data",{materials:S.materials,groups:S.groups,attendance:S.attendance,grades:S.grades,files:S.files}); }
function defaultGroups(){ return [
  {id:"g3a",name:"3°A",grade:3,subject:"Inglés",school:"ESF 22",order:1,students:[]},
  {id:"g3b",name:"3°B",grade:3,subject:"Inglés",school:"ESF 22",order:2,students:[]},
  {id:"g3c",name:"3°C",grade:3,subject:"Inglés",school:"ESF 22",order:3,students:[]},
  {id:"g2d",name:"2°D",grade:2,subject:"Inglés",school:"ESF 22",order:4,students:[]}
]; }
const writeQ = {};
async function put(col,obj){
  const i=S[col].findIndex(x=>x.id===obj.id); if(i>=0) S[col][i]=obj; else S[col].push(obj);
  if(S.mode==="db"){
    const key=col+"/"+obj.id; const {id,...body}=obj;
    const prev = writeQ[key]||Promise.resolve();
    writeQ[key] = prev.then(()=>db.doc(key).set(JSON.parse(JSON.stringify(body)))).catch(e=>{
      toast(e&&e.code==="quota_exceeded"?"Almacenamiento lleno: borra materiales antiguos.":"No se pudo guardar. Revisa tu conexión.");
    });
    return writeQ[key];
  } else localSave();
}
async function del(col,id){
  S[col]=S[col].filter(x=>x.id!==id);
  if(S.mode==="db"){ try{ await db.doc(col+"/"+id).delete(); }catch(e){ toast("No se pudo borrar."); } } else localSave();
}
const debouncers={};
function later(key,fn,ms=700){ clearTimeout(debouncers[key]); debouncers[key]=setTimeout(fn,ms); }

function startDb(d){
  db=d; S.mode="db"; COLS.forEach(c=>S[c]=[]); S.loaded=false; let got=0;
  COLS.forEach(c=>{
    db.collection(c).onSnapshot(snap=>{
      S[c]=snap.docs.map(x=>Object.assign({id:x.id},x.data()));
      if(!S.loaded){ got|=1<<COLS.indexOf(c); if(got===(1<<COLS.length)-1){ S.loaded=true; refresh(true);} }
      else refresh();
    },err=>{ if(err&&err.code==="revoked") toast("Acceso a datos retirado en esta vista."); });
  });
}
function refresh(force){
  const a=document.activeElement;
  const editing = a && $("#main").contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName);
  if(!force && (editing || ["crear","corregir","asistente"].includes(S.view))) return;
  render();
}

/* ================= helpers de datos ================= */
const groupsSorted = () => [...S.groups].sort((a,b)=>(a.order||99)-(b.order||99)||String(a.name).localeCompare(b.name));
const groupById = id => S.groups.find(g=>g.id===id);
const gradesFor = gid => S.grades.find(g=>g.id===gid) || {id:gid, cols:[{id:"c1",name:"Proyecto",w:40},{id:"c2",name:"Examen",w:30},{id:"c3",name:"Tareas",w:20},{id:"c4",name:"Participación",w:10}], vals:{}};
const attFor = (gid,date) => S.attendance.find(a=>a.id===gid+"_"+date) || {id:gid+"_"+date, groupId:gid, date, marks:{}};
function avgFor(gr,sid){
  const v=(gr.vals||{})[sid]||{}; let s=0,w=0;
  (gr.cols||[]).forEach(c=>{ const n=parseFloat(v[c.id]); if(!isNaN(n)){ s+=n*(+c.w||0); w+=(+c.w||0);} });
  return w? s/w : null;
}
function groupAvg(g){ const gr=gradesFor(g.id); const xs=(g.students||[]).map(s=>avgFor(gr,s.id)).filter(x=>x!=null); return xs.length? xs.reduce((a,b)=>a+b,0)/xs.length : null; }
function groupAttToday(g){ const a=S.attendance.find(x=>x.id===g.id+"_"+todayISO()); if(!a||!(g.students||[]).length) return null; const m=a.marks||{}; const p=g.students.filter(s=>m[s.id]==="P"||m[s.id]==="R").length; const marked=g.students.filter(s=>m[s.id]).length; return marked? Math.round(100*p/g.students.length):null; }
const avgClass = x => x==null?"":x>=8?"hi":x>=6?"md":"lo";
const fmt1 = x => x==null?"—":x.toFixed(1);

/* ================= render ================= */
const main=$("#main");
function render(){
  document.querySelectorAll(".nav [data-go]").forEach(b=>b.setAttribute("aria-current", b.dataset.go===S.view?"page":"false"));
  const fn = VIEWS[S.view]||VIEWS.inicio;
  main.innerHTML = '<div class="wrap">'+fn()+'</div>';
  if(S.view==="crear") paintGen();

function ctxLine(){
  const f=S.form, g=groupById(f.grupo);

  const grado = g ? (g.grade? g.grade+"° de secundaria":"secundaria") : "secundaria";
  return `CONTEXTO: Eres un asesor pedagógico experto en la Nueva Escuela Mexicana (Plan de Estudio 2022, Fase 6, secundaria). Docente: Mr. Escudero, ${g&&g.school&&!/22/.test(g.school)?g.school:"Escuela Secundaria Federal No. 22"}, Cd. Juárez, Chihuahua, México. Ciclo escolar 2026–2027. Grupo: ${g?g.name:"general"} (${grado}). Materia: ${materia}${materia==="Inglés"?" (campo formativo Lenguajes)":""}. Considera los ejes articuladores (inclusión, pensamiento crítico, interculturalidad crítica, igualdad de género, vida saludable, apropiación de las culturas a través de la lectura y la escritura, artes y experiencias estéticas) cuando sea pertinente.`;
}
function idiomaRule(){
  const i=S.form.idioma;
  if(i.startsWith("Bilingüe")) return "El material para el alumno va en inglés y cada línea en inglés lleva debajo su traducción al español en cursiva. Las indicaciones para el docente van en español.";
  if(i==="Solo inglés") return "El material para el alumno va solo en inglés; indicaciones del docente en español.";
  return "Todo en español.";
}
const FMT = "FORMATO: Responde solo en Markdown (encabezados ##, listas, tablas GFM cuando ayuden). Sin preámbulo ni despedida. Empieza con un título # breve.";
const temaTxt = () => S.form.tema.trim() || "El que corresponda al material de apoyo y a las indicaciones del docente";
function withSources(p,block){ if(!block) return p; const i=p.indexOf("\n\n"); return i<0? block+"\n\n"+p : p.slice(0,i)+"\n\n"+block+p.slice(i); }
function buildPrompt(t){
  const f=S.form, n=Math.max(3,Math.min(30,+f.numQ||10));
  const base = ctxLine()+"\n\nTEMA: "+temaTxt()+(f.pda?"\nPDA / APRENDIZAJE: "+f.pda:"")+(f.notas?"\nINDICACIONES DEL DOCENTE: "+f.notas:"");
  switch(t){
    case "libre": return `${ctxLine()}\n\nPETICIÓN DEL DOCENTE: ${f.tema}\n\nTAREA: Cumple exactamente la petición con material completo y listo para usar en el aula (instrucciones claras, contenido completo, clave de respuestas si aplica). ${idiomaRule()}\n${FMT}`;
    case "plan": return `${base}\nDURACIÓN: ${f.duracion}\n\nTAREA: Elabora una planeación didáctica de sesión lista para usar. Incluye: datos de identificación (campo formativo, contenido, PDA, eje articulador), propósito, materiales, secuencia con Inicio / Desarrollo / Cierre en una tabla con columnas Momento · Actividad · Tiempo · Organización, preguntas detonadoras, evaluación formativa (instrumento y evidencia), adecuaciones para alumnos que requieren apoyo, y tarea. ${idiomaRule()}\n${FMT}`;
    case "proyecto": return `${base}\nSESIONES: ${f.sesiones}\nMETODOLOGÍA: ${f.metodologia}\n\nTAREA: Diseña un proyecto NEM completo con las fases propias de esa metodología. Para cada fase: sesiones asignadas, actividades concretas, producto parcial. Incluye escenario (aula, escolar o comunitario), problemática del contexto de Cd. Juárez que da sentido al proyecto, producto final, criterios de evaluación y una tabla de cronograma por sesión.\n${FMT}`;
    case "hoja": return `${base}\nNIVEL: ${f.nivel}\nEJERCICIOS: ${n}\n\nTAREA: Crea una hoja de trabajo para el alumno con encabezado (Nombre, Grupo, Fecha), ${n} ejercicios graduados de menor a mayor dificultad y variados (completar, relacionar, ordenar, corregir errores, producción breve), con instrucciones claras. Al final una sección "## Hoja de respuestas (docente)". ${idiomaRule()}\n${FMT}`;
    case "rubrica": return `${base}\n\nTAREA: Crea una rúbrica analítica con 4 a 5 criterios y 4 niveles de desempeño (Sobresaliente, Satisfactorio, Suficiente, Requiere apoyo) en una tabla: filas = criterios con su peso %, columnas = niveles con descriptores observables. Después agrega la conversión a calificación de 5 a 10 y una lista de cotejo breve para autoevaluación del alumno.\n${FMT}`;
    case "lectura": return `${base}\nNIVEL MCER: ${f.nivel}\n\nTAREA: Escribe una lectura original de 180–280 palabras adaptada al nivel ${f.nivel}, con título, ambientada en un contexto cercano a adolescentes de Cd. Juárez. Luego: glosario de 8 palabras (tabla inglés · español), 5 preguntas de comprensión (literal, inferencial y crítica), una actividad de producción breve y la clave de respuestas. ${idiomaRule()}\n${FMT}`;
    case "vocab": return `${base}\nNIVEL: ${f.nivel}\nPALABRAS: ${n}\n\nTAREA: Crea una lista de ${n} palabras o expresiones útiles en inglés sobre el tema, en tabla con columnas: # · Palabra · Pronunciación aproximada para hispanohablantes · Significado · Ejemplo en inglés · Traducción del ejemplo. Después, 3 actividades rápidas para practicarlas en clase (juego, parejas, escritura).\n${FMT}`;
    case "padres": return `${ctxLine()}\n\nASUNTO: ${f.tema}${f.notas?"\nDETALLES: "+f.notas:""}\n\nTAREA: Redacta un mensaje para madres, padres y tutores, cordial, claro y breve (máx. 130 palabras), apto para WhatsApp y para imprimir, firmado por "Mr. Escudero, docente de ${groupById(f.grupo)?.subject||f.materia}". Da dos versiones: ## Versión WhatsApp (con 1–2 emojis moderados) y ## Versión formal (para circular impresa).\n${FMT}`;
  }
}
function quizPrompt(){
  const f=S.form, n=Math.max(3,Math.min(25,+f.numQ||10));
  const lang = f.idioma==="Solo español"?"español":"inglés";
  return `${ctxLine()}\n\nTEMA: ${temaTxt()}\nNIVEL MCER: ${f.nivel}${f.notas?"\nINDICACIONES: "+f.notas:""}\n\nTAREA: Crea un examen de ${n} preguntas de opción múltiple (4 opciones, una sola correcta) que evalúe comprensión y uso, con dificultad progresiva; distribuye la respuesta correcta entre las posiciones 0 a 3 de forma variada; los distractores deben ser plausibles.\nResponde SOLO con JSON con esta forma exacta:\n{"title": string, "instructions": string, "questions": [{"q": string (pregunta en ${lang}), "q_es": string (traducción al español${f.idioma==="Bilingüe (línea por línea)"?"":' o "" si no aplica'}), "options": [string,string,string,string], "answer": number (0-3), "explain": string (explicación breve en español)}]}`;

function quizToMd(z){
  const L="abcd"; let s=`# ${z.title}\n\n${z.instructions||""}\n\n**Nombre:** ____________________  **Grupo:** ______  **Fecha:** __________\n\n`;
  z.questions.forEach((q,i)=>{ s+=`**${i+1}. ${q.q}**${q.q_es?`  \n*${q.q_es}*`:""}\n\n${q.options.map((o,j)=>`${L[j]}) ${o}`).join("  \n")}\n\n`; });
  s+=`---\n\n## Clave de respuestas (docente)\n\n| # | Respuesta | Explicación |\n|---|---|---|\n`+z.questions.map((q,i)=>`| ${i+1} | ${L[q.answer]}) ${String(q.options[q.answer]).replace(/\|/g,"/")} | ${String(q.explain||"").replace(/\|/g,"/")} |`).join("\n")+"\n";

function validQuiz(z){
  if(!z||!Array.isArray(z.questions)) return null;
  const qs=z.questions.filter(q=>q&&q.q&&Array.isArray(q.options)&&q.options.length>=2).map(q=>({q:String(q.q),q_es:String(q.q_es||""),options:q.options.slice(0,4).map(String),answer:Math.max(0,Math.min(3,parseInt(q.answer)||0)),explain:String(q.explain||"")}));

}

async function generate(){
  if(!sample){ toast("La IA no está disponible en esta vista."); return; }
  const t=S.tool, f=S.form;
  if(!f.tema.trim() && (!S.src.length || t==="libre" || t==="padres")){ toast(t==="libre"?"Escribe qué necesitas.":"Escribe el tema primero."); $('[data-f="tema"]')?.focus(); return; }
  const g=groupById(f.grupo);
  S.gen={tool:t,text:"",quiz:null,busy:true,err:"",note:"",savedId:null,topic:(f.tema.trim()||srcNames(S.src)).slice(0,140),groupId:f.grupo,groupName:g?.name||"",subject:g?.subject||f.materia,chars:0,reading:S.src.length?"Leyendo material de apoyo…":""};
  ctl=new AbortController(); const sig=ctl.signal; paintGen();
  try{
    const src = S.src.length ? await gatherSources(S.src, m=>{ if(S.gen){ S.gen.reading=m; paintStatus(); } }) : null;
    if(sig.aborted) throw {code:"cancelled"};
    if(S.gen) S.gen.reading="";
    if(src&&src.warn) S.gen.note=src.warn;
    const opts={signal:sig,cache:false}; if(src&&src.images.length) opts.images=src.images;
    if(t==="examen"){
      const data = await sample.json(withSources(quizPrompt(),src&&src.block),Object.assign(opts,{onText:({text})=>{S.gen.chars=text.length; paintStatus();}}));
      const z=validQuiz(data); if(!z) throw {code:"invalid_json"};
      S.gen.quiz=z; S.gen.text=quizToMd(z);
    } else {
      const r = await sample(withSources(buildPrompt(t),src&&src.block),Object.assign(opts,{onText:({text})=>{S.gen.text=text; S.gen.chars=text.length; schedulePaint();}}));
      S.gen.text=r.text; if(r.truncated) S.gen.note=(S.gen.note?S.gen.note+" ":"")+"El material quedó incompleto por su longitud. Pide menos contenido o divide el tema.";
    }
  }catch(e){
    const c=e&&e.code; if(t!=="examen" && e && e.text && c!=="refused") S.gen.text=e.text; else if(c==="refused") S.gen.text="";
    if(c!=="cancelled") S.gen.err=errMsg(c); hardFail(c);
  }finally{ S.gen.busy=false; ctl=null; if(S.view==="crear") paintGen(); }
}
let rafP=0;
function schedulePaint(){ if(rafP) return; rafP=requestAnimationFrame(()=>{rafP=0; if(S.view==="crear") paintGen(true);}); }
function paintStatus(){ const s=$("#genStatus"); if(s&&S.gen) s.innerHTML=statusHTML(); }
function statusHTML(){ const g=S.gen; if(g.busy) return `<span class="pulse"></span>${g.reading?esc(g.reading):g.chars?(g.tool==="examen"?"Armando preguntas":"Escribiendo")+" · "+g.chars.toLocaleString("es-MX")+" caracteres":"Pensando… (10–40 s)"}`; if(g.savedId) return '<span style="color:var(--leaf)">● Guardado en biblioteca</span>'; return g.text?"Listo":""; }
function paintGen(onlyBody){

const safeName = s => String(s||"material").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"_").slice(0,60)||"material";
async function offerFile(filename,data,fallbackText){
  const blob = data instanceof Blob ? data : new Blob([data]);
  if(!downloads){
    if(!inClaude){ const u=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=u; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),60000); return true; }
    if(fallbackText!=null){ copyText(fallbackText); toast("Descarga no disponible aquí; lo copié al portapapeles."); } else toast("Las descargas no están disponibles en esta vista.");
    return false;
  }
  try{ await downloads.save({filename,data:blob}); return true; }
  catch(e){
    const c=e&&e.code; if(c==="declined") return false;
    if(c==="rejected_extension"||c==="extension_not_enabled"){
      try{ await loadLib("jszip"); const z=new JSZip(); z.file(filename,blob); const zb=await z.generateAsync({type:"blob"}); await downloads.save({filename:filename.replace(/\.[^.]*$/,"")+".zip",data:zb}); toast("Se descargó dentro de un .zip para conservar el formato original"); return true; }
      catch(e2){ if(e2&&e2.code==="declined") return false; }
    }
    toast(c==="too_large"?"El archivo es demasiado grande para descargarlo aquí.":"No se pudo descargar el archivo."); return false;
  }
}
async function exportMat(title,mdText,ext){
  const name=safeName(title);
  if(ext==="md") return offerFile(name+".md",mdText,mdText);
  // Word abre HTML con estilos; se entrega como .html compatible con Word (.docx real requiere empaquetado)
  const blob=new Blob([htmlDoc(title,mdText)],{type:"text/html"});
  return offerFile(name+".html",blob,mdText);
}

async function sendChat(text){
  text=text.trim(); if(!text) return; if(!sample){ toast("La IA no está disponible en esta vista."); return; }
  S.chat.push({role:"user",content:text}); S.chat.push({role:"assistant",content:""}); S.chatBusy=true; render();
  ctl=new AbortController(); const sig=ctl.signal; const last=S.chat[S.chat.length-1]; let wait="_Pensando…_";
  const paint=()=>{ const bs=document.querySelectorAll("#chatlog .msg.ai .doc"); const b=bs[bs.length-1]; if(b){ b.innerHTML=md(last.content||wait); } };
  paint();
  try{
    let src=null;
    if(S.chatSrc.length){ src=await gatherSources(S.chatSrc,m=>{ wait="_"+m+"_"; paint(); }); wait="_Pensando…_"; paint(); if(sig.aborted) throw {code:"cancelled"}; }
    const rules=CHAT_RULES()+(src?"\n\n"+src.block+"\nCuando el docente pida algo, apóyate principalmente en ese material de apoyo.":"");
    const turns=[{role:"user",content:rules},...S.chat.slice(0,-1).slice(-16)];
    const opts={cache:false,signal:sig,onText:({text})=>{ last.content=text; paint(); }}; if(src&&src.images.length) opts.images=src.images;
    const r=await sample(turns,opts); last.content=r.text; if(src&&src.warn) last.content+="\n\n> "+src.warn; }
  catch(e){ last.content=(e&&e.text)||""; if(e&&e.code!=="cancelled") last.content+=(last.content?"\n\n":"")+"> "+errMsg(e.code); hardFail(e&&e.code); if(!last.content) S.chat.pop(); }

}

function idb(){ return idbP || (idbP=new Promise((res,rej)=>{ const r=indexedDB.open("aulazorro",1); r.onupgradeneeded=()=>r.result.createObjectStore("blobs"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); })); }

const idbPut=(k,v)=>idbDo("readwrite",s=>s.put(v,k)), idbGet=k=>idbDo("readonly",s=>s.get(k)), idbDel=k=>idbDo("readwrite",s=>s.delete(k));

function fileToB64(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]||""); r.onerror=()=>rej(r.error); r.readAsDataURL(file); }); }
function b64ToBlob(s,mime){ s=s.replace(/\s+/g,""); const parts=[], CH=4*262144; for(let i=0;i<s.length;i+=CH){ const bin=atob(s.slice(i,i+CH)); const u=new Uint8Array(bin.length); for(let j=0;j<bin.length;j++) u[j]=bin.charCodeAt(j); parts.push(u); } return new Blob(parts,{type:mime||"application/octet-stream"}); }
const blobCache=new Map(), urlCache=new Map();
async function getBlob(f){
  if(blobCache.has(f.id)) return blobCache.get(f.id);
  let b;
  if(f.local){ b=await idbGet(f.id); if(!b) throw new Error("missing"); }
  else { const r=await fetch("/_blob/"+f.assetId); if(!r.ok) throw new Error("missing"); b = f.wrapped ? b64ToBlob(await r.text(), f.mime) : new Blob([await r.blob()],{type:f.mime}); }
  if(blobCache.size>12) blobCache.delete(blobCache.keys().next().value);
  blobCache.set(f.id,b); return b;
}
async function mediaUrl(f){ if(!f.local&&!f.wrapped) return "/_blob/"+f.assetId; if(urlCache.has(f.id)) return urlCache.get(f.id); const u=URL.createObjectURL(await getBlob(f)); urlCache.set(f.id,u); return u; }

const UPERR={too_large:"Supera el tamaño máximo",unsupported_type:"Tipo de archivo no aceptado",quota_or_state:"Se llenó el espacio de archivos. Borra algunos.",rate_limited:"Muchas subidas seguidas. Espera un momento.",upstream_auth:"Recarga la página e inicia sesión de nuevo",not_granted:"Sin permiso para subir en esta vista"};

async function uploadFiles(list){
  const files=[...list]; if(!files.length) return;
  if(!canUpload()) return toast("Solo quien edita esta página puede subir archivos.");
  const cat=S.upCat, grp=S.upGrp;
  for(const file of files){
    const e=extOf(file.name), direct=!!DIRECT[e], limit=direct?MAX_DIRECT:MAX_WRAP;
    const job={id:uid(),name:file.name,st:"Subiendo…",ok:false,bad:false}; S.up.unshift(job); paintUp();
    try{
      if(file.size>limit) throw {msg:"Supera "+fmtSize(limit)+". Comprímelo o divídelo."};
      if(!file.size) throw {msg:"El archivo está vacío"};
      const meta={id:job.id,name:file.name,ext:e,size:file.size,mime:DIRECT[e]||file.type||"application/octet-stream",cat,groupId:grp,groupName:groupById(grp)?.name||"",createdAt:Date.now(),wrapped:!direct};
      if(assets){
        let r;
        if(direct) r=await uploadOnce(file,DIRECT[e]);
        else { job.st="Preparando…"; paintUp(); const b64=await fileToB64(file); job.st="Subiendo…"; paintUp(); r=await uploadOnce(new Blob([b64],{type:"text/plain"}),"text/plain"); }
        meta.assetId=r.id;
      } else { await idbPut(job.id,file); meta.local=true; }
      blobCache.set(job.id,file);
      await put("files",meta); job.st="Guardado"; job.ok=true;
    }catch(err){ job.bad=true; job.st=(err&&err.msg)||UPERR[err&&err.code]||"No se pudo subir. Intenta de nuevo."; }
    paintUp();

}

async function pdfDoc(blob){ await loadLib("pdfjs"); return pdfjsLib.getDocument({data:new Uint8Array(await blob.arrayBuffer()),isEvalSupported:false}).promise; }
async function renderPdfPages(doc,box,max){
  for(let i=1;i<=Math.min(doc.numPages,max);i++){
    if(!box.isConnected) return;
    const p=await doc.getPage(i), vp0=p.getViewport({scale:1}), w=Math.min(box.clientWidth-40||700,900), dpr=window.devicePixelRatio||1;
    const vp=p.getViewport({scale:(w/vp0.width)*dpr}); const c=document.createElement("canvas"); c.width=vp.width; c.height=vp.height; c.style.width=w+"px"; box.appendChild(c);
    await p.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
  }
  if(doc.numPages>max && box.isConnected){ const n=document.createElement("p"); n.className="muted"; n.style.textAlign="center"; n.textContent=`Se muestran ${max} de ${doc.numPages} páginas. Usa Proyectar o descarga el original para ver todo.`; box.appendChild(n); }
}
async function pptxSlides(ab){
  await loadLib("jszip"); const z=await JSZip.loadAsync(ab);
  const names=Object.keys(z.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a,b)=>+a.match(/(\d+)\.xml$/)[1]-+b.match(/(\d+)\.xml$/)[1]);
  const out=[]; for(const n of names){ const x=await z.file(n).async("string"); const d=new DOMParser().parseFromString(x,"application/xml"); out.push([...d.getElementsByTagName("a:p")].map(p=>[...p.getElementsByTagName("a:t")].map(t=>t.textContent).join("")).filter(s=>s.trim())); }
  return out;
}
async function renderPreview(f,box){
  const e=f.ext;
  if(IMG_EXT.includes(e)){ box.innerHTML=`<img src="${esc(await mediaUrl(f))}" alt="${esc(f.name)}">`; return; }
  if(["mp4","webm","mov","m4v"].includes(e)){ box.innerHTML=`<video controls src="${esc(await mediaUrl(f))}"></video>`; return; }
  if(["mp3","wav","ogg","m4a","aac","opus"].includes(e)){ box.innerHTML=`<audio controls src="${esc(await mediaUrl(f))}" style="width:100%"></audio>`; return; }
  const b=await getBlob(f); if(!box.isConnected) return;
  if(e==="pdf"){ const doc=await pdfDoc(b); box.innerHTML=""; await renderPdfPages(doc,box,12); return; }
  if(e==="docx"){ await loadLib("mammoth"); const r=await mammoth.convertToHtml({arrayBuffer:await b.arrayBuffer()}); box.innerHTML=`<div class="doc" style="padding:0">${DOMPurify.sanitize(r.value)}</div>`; return; }
  if(["xlsx","xls","ods","csv"].includes(e)){ await loadLib("xlsx"); const wb=XLSX.read(await b.arrayBuffer(),{type:"array"}); box.innerHTML=wb.SheetNames.map(n=>`<h3 style="margin:10px 0 6px;font-size:16px">${esc(n)}</h3><div class="xl">${DOMPurify.sanitize(XLSX.utils.sheet_to_html(wb.Sheets[n]))}</div>`).join(""); return; }
  if(e==="pptx"){ const sl=await pptxSlides(await b.arrayBuffer()); box.innerHTML=`<p class="muted" style="margin-top:0">Texto de ${sl.length} diapositivas. Descarga el original para verlas con su diseño.</p>`+sl.map((p,i)=>`<div class="qitem" style="margin-bottom:8px"><div class="qn">DIAPOSITIVA ${i+1}</div>${p.map(x=>`<div>${esc(x)}</div>`).join("")||'<span class="muted">(sin texto)</span>'}</div>`).join(""); return; }
  if(["txt","md","json","html","htm","xml","srt","vtt"].includes(e)){ const t=await b.text(); box.innerHTML=e==="md"?`<div class="doc" style="padding:0">${md(t)}</div>`:`<pre style="white-space:pre-wrap;font:13px/1.5 var(--f-mono);margin:0">${esc(t.slice(0,200000))}</pre>`; return; }
  throw new Error("nopreview");
}
function openFile(id){

const TXT_CAP=90000;
async function extractSource(x,imgs,maxImgs){

  const f=x.f, e=f.ext;
  if(IMG_EXT.includes(e) && e!=="svg"){ if(imgs.length<maxImgs){ imgs.push(await getBlob(f)); return {text:"(Imagen adjunta: "+f.name+")"}; } return {text:"",warn:"imagen"}; }

      let n=0; for(let i=1;i<=doc.numPages && imgs.length<maxImgs;i++){ const p=await doc.getPage(i); const vp0=p.getViewport({scale:1}); const vp=p.getViewport({scale:Math.min(2,1500/vp0.width)}); const c=document.createElement("canvas"); c.width=vp.width; c.height=vp.height; await p.render({canvasContext:c.getContext("2d"),viewport:vp}).promise; imgs.push(await new Promise(r=>c.toBlob(r,"image/jpeg",.85))); n++; }
      return {text:`(PDF escaneado: se adjuntan ${n} de ${doc.numPages} páginas como imagen)`, warn:n<doc.numPages?"escaneado":""};
    }
    return {text:txt};
  }
  if(e==="docx"){ await loadLib("mammoth"); const r=await mammoth.extractRawText({arrayBuffer:await b.arrayBuffer()}); return {text:r.value}; }
  if(["xlsx","xls","ods","csv"].includes(e)){ await loadLib("xlsx"); const wb=XLSX.read(await b.arrayBuffer(),{type:"array"}); return {text:wb.SheetNames.map(n=>"[Hoja "+n+"]\n"+XLSX.utils.sheet_to_csv(wb.Sheets[n],{blankrows:false})).join("\n\n")}; }
  if(e==="pptx"){ const sl=await pptxSlides(await b.arrayBuffer()); return {text:sl.map((p,i)=>"[Diapositiva "+(i+1)+"]\n"+p.join("\n")).join("\n\n")}; }

  return {text:"",warn:"formato"};
}
async function gatherSources(keys,onMsg){
  const items=keys.map(srcItem).filter(Boolean); const imgs=[]; const maxImgs=S.canImg?Math.max(0,S.imgMax||5):0;
  const parts=[], skipped=[], cut=[]; let total=0; const budget=150000;
  for(let i=0;i<items.length;i++){
    const x=items[i]; onMsg&&onMsg(`Leyendo ${i+1} de ${items.length}: ${x.name}`);
    let r; try{ r=await extractSource(x,imgs,maxImgs); }catch(e){ skipped.push(x.name); continue; }
    if(r.warn==="formato"||r.warn==="imagen"&&!r.text){ skipped.push(x.name); continue; }
    if(r.warn==="escaneado") cut.push(x.name);
    let t=String(r.text||"").trim(); const room=Math.max(0,Math.min(TXT_CAP,budget-total));

const PW=612, PH=792, MG=54;
const wa=s=>String(s??"").replace(/\r/g,"").replace(/\t/g,"    ").replace(/[^\n\x20-\x7E\xA0-\xFF\u2013\u2014\u2018\u2019\u201C\u201D\u2022\u2026\u20AC]/g,"?");
function pdfWriter(pdf,F,title){
  const ink=PDFLib.rgb(.09,.13,.23), grey=PDFLib.rgb(.45,.47,.52);
  let page=null, y=0; const start=pdf.getPageCount();
  const np=()=>{ page=pdf.addPage([PW,PH]); y=PH-MG; page.drawText(wa(title).slice(0,95),{x:MG,y:PH-32,size:8,font:F.r,color:grey}); };
  const wrap=(t,font,size,maxW)=>{ const out=[]; for(const para of wa(t).split("\n")){ let line=""; for(let w of para.split(/ +/)){ const test=line?line+" "+w:w; if(font.widthOfTextAtSize(test,size)<=maxW){ line=test; continue; } if(line) out.push(line); while(w.length>1&&font.widthOfTextAtSize(w,size)>maxW){ let k=w.length; while(k>1&&font.widthOfTextAtSize(w.slice(0,k),size)>maxW) k--; out.push(w.slice(0,k)); w=w.slice(k); } line=w; } out.push(line); } return out; };
  const api={
    text(t,o={}){ const size=o.size||10.5, font=o.bold?F.b:F.r, lh=size*1.38; if(!page) np(); y-=o.gap||0; for(const ln of wrap(t,font,size,PW-2*MG-(o.indent||0))){ if(y-lh<MG) np(); y-=lh; if(ln) page.drawText(ln,{x:MG+(o.indent||0),y,size,font,color:o.color||ink}); } },
    gap(n){ if(!page) np(); y-=n; },
    rule(){ if(!page) np(); y-=6; page.drawLine({start:{x:MG,y},end:{x:PW-MG,y},thickness:.6,color:PDFLib.rgb(.8,.8,.8)}); y-=8; },
    table(rows){ rows=rows.filter(r=>r.some(c=>String(c??"").trim())); if(!rows.length) return; if(!page) np();
      const nc=Math.min(10,Math.max(...rows.map(r=>r.length))), size=nc>7?6.5:nc>4?7.5:8.5, cw=(PW-2*MG)/nc, lh=size*1.25;
      rows.slice(0,2500).forEach((r,ri)=>{ const font=ri===0?F.b:F.r; const cells=[]; for(let c=0;c<nc;c++) cells.push(wrap(String(r[c]??""),font,size,cw-6).slice(0,5));
        const h=Math.max(1,...cells.map(x=>x.length))*lh+6; if(y-h<MG) np();
        cells.forEach((ls,c)=>{ const x=MG+c*cw; const o={x,y:y-h,width:cw,height:h,borderColor:PDFLib.rgb(.72,.74,.78),borderWidth:.5}; if(ri===0) o.color=PDFLib.rgb(.92,.93,.9); page.drawRectangle(o); ls.forEach((ln,li)=>{ if(ln) page.drawText(ln,{x:x+3,y:y-3-size-li*lh,size,font,color:ink}); }); });
        y-=h; });
      y-=10; },
    get start(){ return start; }
  };
  return api;
}
function mdToPdf(w,src){
  const clean=s=>s.replace(/\*\*|__/g,"").replace(/(^|[\s(])[*_]([^*_\n]+)[*_](?=[\s).,;:!?]|$)/g,"$1$2").replace(/`/g,"").replace(/\[([^\]]+)\]\([^)]*\)/g,"$1").replace(/<[^>]+>/g,"").replace(/\s{2,}$/,"");
  let tbl=[]; const flush=()=>{ if(tbl.length){ w.table(tbl); tbl=[]; } };
  for(const raw of String(src||"").split("\n")){ const l=raw.replace(/\s+$/,""); let m;
    if(/^\s*\|.*\|\s*$/.test(l)){ if(!/^\s*\|[\s:\-|]+\|\s*$/.test(l)) tbl.push(l.trim().replace(/^\||\|$/g,"").split("|").map(c=>clean(c.trim()))); continue; }
    flush();
    if(!l.trim()) w.gap(5);
    else if(m=l.match(/^#\s+(.*)/)) w.text(clean(m[1]),{size:17,bold:true,gap:4});
    else if(m=l.match(/^##\s+(.*)/)) w.text(clean(m[1]),{size:13.5,bold:true,gap:8});
    else if(m=l.match(/^#{3,6}\s+(.*)/)) w.text(clean(m[1]),{size:11.5,bold:true,gap:5});
    else if(/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(l)) w.rule();
    else if(m=l.match(/^(\s*)[-*+]\s+(.*)/)) w.text("•  "+clean(m[2]),{indent:10+Math.min(3,Math.floor(m[1].length/2))*12});
    else if(m=l.match(/^(\s*)(\d+)[.)]\s+(.*)/)) w.text(m[2]+".  "+clean(m[3]),{indent:10});
    else if(m=l.match(/^>\s?(.*)/)) w.text(clean(m[1]),{indent:14,color:PDFLib.rgb(.17,.36,.67)});
    else w.text(clean(l));
  } flush();
}
function htmlToPdf(w,html){ const d=new DOMParser().parseFromString(html,"text/html");

    if(/^H[1-6]$/.test(t)) w.text(n.textContent.trim(),{size:t==="H1"?16:t==="H2"?13.5:11.5,bold:true,gap:6});
    else if(t==="P"){ const s=n.textContent.trim(); if(s) w.text(s,{gap:3}); }
    else if(t==="UL"||t==="OL") [...n.children].forEach((li,i)=>w.text((t==="OL"?(i+1)+".":"•")+"  "+li.textContent.trim(),{indent:12}));
    else if(t==="TABLE") w.table([...n.querySelectorAll("tr")].map(tr=>[...tr.children].map(c=>c.textContent.trim())));

async function imgBytes(blob,ext){

  const u=URL.createObjectURL(blob);
  try{ const im=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=u; });

async function runPrint(){

async function zipOriginals(items,onMsg){
  await loadLib("jszip"); const z=new JSZip(), used=new Set(); let n=0, fail=[];
  for(let i=0;i<items.length;i++){ const x=items[i]; onMsg&&onMsg(`Reuniendo ${i+1} de ${items.length}: ${x.name}`);
    try{ let folder, name, data;
      if(x.f){ folder=x.f.cat||"Otros"; name=x.f.name; data=await getBlob(x.f); }
      else { folder="Biblioteca"; name=safeName(x.m.title)+".html"; data=htmlDoc(x.m.title,x.m.content); }
      let path=folder+"/"+name, k=1; while(used.has(path.toLowerCase())){ k++; path=folder+"/"+name.replace(/(\.[^.]*)?$/,m=>" ("+k+")"+m); }
      used.add(path.toLowerCase()); z.file(path,data); n++;
    }catch(e){ fail.push(x.name); } }
  if(!n) throw new Error("vacío");
  const zb=await z.generateAsync({type:"blob"});
  await offerFile("Archivos_Aula_Zorro_"+todayISO()+".zip",zb);
  return fail;
}

function closeStage(){ clearInterval(stTimer); stTimer=null; ST=null; $("#stageRoot").innerHTML=""; document.removeEventListener("keydown",stageKeys); if(document.fullscreenElement) document.exitFullscreen?.().catch(()=>{}); }
function stageKeys(e){
  if(!ST) return; if(e.key==="Escape"){ closeStage(); return; }
  if(ST.mode==="quiz"){ if(e.key==="ArrowRight") stageAct("next"); else if(e.key==="ArrowLeft") stageAct("prev"); else if(e.key===" "){ e.preventDefault(); stageAct("reveal"); } else if(/^[1-4abcdABCD]$/.test(e.key)){ const k="1234".includes(e.key)?+e.key-1:"abcd".indexOf(e.key.toLowerCase()); stageAct("pick",k);} }
  if(ST.mode==="ruleta" && e.key===" "){ e.preventDefault(); stageAct("spin"); }
  if(ST.mode==="pdf"){ if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){ e.preventDefault(); stageAct("pgNext"); } else if(e.key==="ArrowLeft"||e.key==="PageUp"){ stageAct("pgPrev"); } }
}
function startQTimer(){ clearInterval(stTimer); ST.qleft=ST.qt; stTimer=setInterval(()=>{ if(!ST||ST.rev) return; ST.qleft--; const b=$("#qbar"); if(b) b.style.width=(100*ST.qleft/ST.qt)+"%"; const n=$("#qleft"); if(n) n.textContent=ST.qleft+" s"; if(ST.qleft<=0){ ST.rev=true; beep(); paintStage(); } },1000); }
function beep(){ try{ audio=audio||new (window.AudioContext||window.webkitAudioContext)(); const o=audio.createOscillator(), g=audio.createGain(); o.frequency.value=880; g.gain.setValueAtTime(.2,audio.currentTime); g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.6); o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime+.6);}catch(e){} }
const mmss = s => String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
function paintStage(){

  } else if(ST.mode==="equipos"){
    title=`Equipos · ${esc(g?.name||"")}`;
    body = !names.length? `<div class="huge" style="font-size:40px">Agrega alumnos a ${esc(g?.name||"este grupo")} para formar equipos</div>` :
      ST.teams? `<div class="teams">${ST.teams.map((t,i)=>`<div class="team"><h3>Equipo ${i+1}</h3><ol style="margin:0;padding-left:1.2em">${t.map(n=>`<li>${esc(n)}</li>`).join("")}</ol></div>`).join("")}</div>`
      : `<div class="huge" style="font-size:clamp(40px,8vw,96px)">${names.length} alumnos → ${ST.nTeams} equipos</div>`;
    ctrls=`<span class="row" style="gap:6px">Equipos <button class="sbtn" data-sa="nt" data-k="-1">−</button><b class="mono">${ST.nTeams}</b><button class="sbtn" data-sa="nt" data-k="1">+</button></span><button class="sbtn hot" data-sa="mkTeams" ${!names.length?"disabled":""}>${ST.teams?"Rehacer":"Formar equipos"}</button>`;
  } else if(ST.mode==="timer"){
    title="Temporizador";
    body=`<div class="huge" id="tleft" style="font-size:clamp(90px,24vw,300px);color:${ST.left===0?"var(--fox)":"inherit"}">${mmss(ST.left)}</div>`;

    <div class="center" style="${ST.mode==="text"?"justify-content:flex-start":""}">${body}</div>${ctrls?`<div class="row" style="justify-content:center;gap:10px">${ctrls}</div>`:""}</div>`;
  if(ST.mode==="pdf") drawStagePdf();
}
async function drawStagePdf(){
  const c=$("#stc"); if(!c||!ST||ST.mode!=="pdf") return;
  try{ const p=await ST.doc.getPage(ST.pg); if(!c.isConnected) return; const vp0=p.getViewport({scale:1});
    const maxW=Math.max(200,c.parentElement.clientWidth), maxH=Math.max(200,window.innerHeight-170), s=Math.min(maxW/vp0.width,maxH/vp0.height), dpr=window.devicePixelRatio||1;
    const vp=p.getViewport({scale:s*dpr}); c.width=vp.width; c.height=vp.height; c.style.width=Math.floor(vp0.width*s)+"px"; c.style.height=Math.floor(vp0.height*s)+"px";
    await p.render({canvasContext:c.getContext("2d"),viewport:vp}).promise; }catch(e){}
}
function stageAct(a,k){
  if(!ST) return;
  switch(a){
    case "close": closeStage(); return;
    case "pgNext": if(ST.doc&&ST.pg<ST.doc.numPages){ ST.pg++; paintStage(); } return;
    case "pgPrev": if(ST.doc&&ST.pg>1){ ST.pg--; paintStage(); } return;
    case "fs": { const el=$("#stage"); if(document.fullscreenElement) document.exitFullscreen?.().catch(()=>{}); else el?.requestFullscreen?.().catch(()=>toast("Pantalla completa no disponible aquí")); return; }
    case "pick": if(ST.rev) return; ST.sel=+k; paintStage(); return;
    case "reveal": if(ST.mode!=="quiz") return; ST.rev=true; paintStage(); return;
    case "next": if(ST.i<ST.quiz.questions.length-1){ ST.i++; ST.rev=false; ST.sel=null; startQTimer(); paintStage(); } else closeStage(); return;
    case "prev": if(ST.i>0){ ST.i--; ST.rev=true; ST.sel=null; paintStage(); } return;
    case "norep": ST.noRep=!ST.noRep; return;
    case "resetR": ST.picked=[]; ST.name=""; paintStage(); return;
    case "spin": {
      if(ST.spinning) return; const names=(ST.g?.students||[]).map(s=>s.name); if(!names.length) return;
      let pool=names.filter(n=>!ST.noRep||!ST.picked.includes(n)); if(!pool.length){ ST.picked=[]; pool=names; }
      const winner=pool[Math.floor(Math.random()*pool.length)]; ST.spinning=true; paintStage();
      const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches; let d=40, steps=reduce?1:26;
      const tick=()=>{ if(!ST) return; steps--; const el=$("#rname"); if(steps<=0){ ST.name=winner; ST.spinning=false; ST.picked.push(winner); beep(); paintStage(); return; } if(el) el.textContent=names[Math.floor(Math.random()*names.length)]; d*=1.12; setTimeout(tick,d); };
      tick(); return; }
    case "nt": ST.nTeams=Math.max(2,Math.min(8,ST.nTeams+(+k))); ST.teams=null; paintStage(); return;
    case "mkTeams": { const names=shuffle((ST.g?.students||[]).map(s=>s.name)); const t=Array.from({length:ST.nTeams},()=>[]); names.forEach((n,i)=>t[i%ST.nTeams].push(n)); ST.teams=t; paintStage(); return; }
    case "preset": ST.secs=ST.left=(+k)*60; ST.running=false; clearInterval(stTimer); paintStage(); return;
    case "treset": ST.left=ST.secs; ST.running=false; clearInterval(stTimer); paintStage(); return;
    case "tgo":
      if(ST.running){ ST.running=false; clearInterval(stTimer); paintStage(); return; }
      if(ST.left<=0) ST.left=ST.secs; ST.running=true; beepPrime(); paintStage();
      stTimer=setInterval(()=>{ if(!ST) return; ST.left--; const el=$("#tleft"); if(el) el.textContent=mmss(Math.max(0,ST.left)); if(ST.left<=0){ clearInterval(stTimer); ST.running=false; ST.left=0; beep(); setTimeout(beep,700); setTimeout(beep,1400); paintStage(); } },1000);
      return;
  }
}

  srcPick:b=>openSrcPicker(b.dataset.key),
  srcRm:b=>{ const k=b.dataset.key; S[k]=S[k].filter(x=>x!==b.dataset.k); if(k==="src") ls.set("src",S.src); render(); },
  srcDone:()=>{ const p=S._pick; if(!p) return; S[p.key]=[...p.sel].filter(k=>srcItem(k)).slice(0,6); if(p.key==="src") ls.set("src",S.src); closeModal(); render(); },
  goTool:b=>{ S.tool=b.dataset.tool; ls.set("tool",S.tool); if(EX_Q[S.tool]) S.form.numQ=EX_Q[S.tool]; go("crear"); },
  tool:b=>{ if(S.gen&&S.gen.busy) return toast("Espera a que termine o detén la generación."); S.tool=b.dataset.tool; ls.set("tool",S.tool); if(EX_Q[S.tool]) S.form.numQ=EX_Q[S.tool]; S.gen=null; render(); },
  stop:()=>ctl&&ctl.abort(),
  genSave:()=>saveGen(),
  genCopy:()=>S.gen&&copyText(S.gen.text),
  genDl:b=>S.gen&&exportMat(S.gen.quiz?S.gen.quiz.title:titleFrom(S.gen.text,TYPES[S.gen.tool].name),S.gen.text,b.dataset.ext),
  genStage:()=>{ const g=S.gen; if(!g) return; if(g.quiz) openStage("quiz",{quiz:g.quiz}); else openStage("text",{mat:{title:titleFrom(g.text,"Material"),content:g.text}}); },
  openMat:b=>{ matEdit=false; openMat(b.dataset.id); },
  closeModal:()=>closeModal(),
  matEdit:b=>{ matEdit=!matEdit; openMat(b.dataset.id); },
  matSaveEdit:async b=>{ const m=S.materials.find(x=>x.id===b.dataset.id); const t=$("#matText"); if(!m||!t) return; const nm=Object.assign({},m,{content:t.value,title:titleFrom(t.value,m.title)}); matEdit=false; await put("materials",nm); openMat(m.id); toast("Cambios guardados"); if(S.view!=="crear") render(); },
  matCopy:b=>{ const m=S.materials.find(x=>x.id===b.dataset.id); if(m) copyText(m.content); },
  matDl:b=>{ const m=S.materials.find(x=>x.id===b.dataset.id); if(m) exportMat(m.title,m.content,b.dataset.ext); },
  matDel:async b=>{ if(!confirmTwice(b,"¿Eliminar? Toca de nuevo")) return; await del("materials",b.dataset.id); closeModal(); render(); toast("Material eliminado"); },
  newNote:async()=>{ const id=uid(); const d={id,type:"nota",title:"Nota nueva",content:"# Nota nueva\n\nEscribe aquí…",createdAt:Date.now()}; await put("materials",d); matEdit=true; openMat(id); render(); },
  quizStage:b=>{ const m=S.materials.find(x=>x.id===b.dataset.id); if(m&&m.quiz){ closeModal(); openStage("quiz",{quiz:m.quiz}); } },
  textStage:b=>{ const m=S.materials.find(x=>x.id===b.dataset.id); if(m){ closeModal(); openStage("text",{mat:m}); } },
  libT:b=>{ S.libT=b.dataset.t; render(); },
  openGroup:b=>{ S.gSel=b.dataset.id; ls.set("gSel",S.gSel); S.gTab="alumnos"; go("grupos"); },
  gSel:b=>{ S.gSel=b.dataset.id; ls.set("gSel",S.gSel); render(); },
  gTab:b=>{ S.gTab=b.dataset.t; render(); },
  stage:b=>openStage(b.dataset.m),
  seedGroups:async()=>{ for(const g of defaultGroups()) await put("groups",g); render(); },
  newGroup:()=>modal(`<div class="mhead"><h2>Nuevo grupo</h2><button class="btn ghost" data-act="closeModal" aria-label="Cerrar">✕</button></div>
    <form class="pad form" id="ngForm"><div class="grid2"><label class="f">Nombre<input class="in" id="ng_name" placeholder="Ej. 2°B" required autofocus></label><label class="f">Grado<input class="in" type="number" min="1" max="3" id="ng_grade" value="2"></label>
    <label class="f">Materia<input class="in" id="ng_subject" value="Inglés"></label><label class="f">Escuela<input class="in" id="ng_school" value="ESF 22"></label></div>
    <div class="row" style="justify-content:flex-end"><button class="btn primary" type="submit">Crear grupo</button></div></form>`),
  rmStu:async b=>{ if(!confirmTwice(b,"¿Quitar?")) return; const g=currentGroup(); await put("groups",Object.assign({},g,{students:(g.students||[]).filter(s=>s.id!==b.dataset.id)})); render(); },
  clearEx:async()=>{ const g=currentGroup(); await put("groups",Object.assign({},g,{students:(g.students||[]).filter(s=>!s.ex)})); render(); toast("Ejemplos quitados"); },
  pasteStu:async()=>{ const t=$("#stuPaste").value; const names=t.split(/\r?\n/).map(x=>x.replace(/^\s*\d+[\.\)\-\s]+/,"").replace(/\t+/g," ").trim()).filter(Boolean); if(!names.length) return toast("Pega al menos un nombre."); addStudents(names,$("#stuSort").checked); },
  mark:b=>{ const g=currentGroup(); const a=JSON.parse(JSON.stringify(attFor(g.id,S.attDate))); a.marks=a.marks||{}; a.marks[b.dataset.sid]= a.marks[b.dataset.sid]===b.dataset.v?undefined:b.dataset.v; if(!a.marks[b.dataset.sid]) delete a.marks[b.dataset.sid]; setAtt(a); },
  allP:()=>{ const g=currentGroup(); const a=JSON.parse(JSON.stringify(attFor(g.id,S.attDate))); a.marks={}; (g.students||[]).forEach(s=>a.marks[s.id]="P"); setAtt(a); },
  rmCol:async b=>{ const g=currentGroup(); const gr=JSON.parse(JSON.stringify(gradesFor(g.id))); gr.cols=gr.cols.filter(c=>c.id!==b.dataset.id); await put("grades",gr); render(); },
  csv:()=>{ const g=currentGroup(); const gr=gradesFor(g.id); const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"'; const rows=[["#","Alumno",...gr.cols.map(c=>c.name+" ("+c.w+"%)"),"Promedio"].map(q).join(",")]; (g.students||[]).forEach((s,i)=>{ const v=(gr.vals||{})[s.id]||{}; const av=avgFor(gr,s.id); rows.push([i+1,s.name,...gr.cols.map(c=>v[c.id]??""),av==null?"":av.toFixed(1)].map(q).join(",")); }); const csv="﻿"+rows.join("\n"); offerFile(safeName("Calificaciones_"+g.name)+".csv",csv,csv); },
  saveGroup:async()=>{ const g=currentGroup(); const n=$("#gs_name").value.trim(); if(!n) return toast("El grupo necesita nombre."); await put("groups",Object.assign({},g,{name:n,grade:+$("#gs_grade").value||null,subject:$("#gs_subject").value.trim(),school:$("#gs_school").value.trim()})); render(); toast("Grupo actualizado"); },
  rmGroup:async b=>{ if(!confirmTwice(b,"Se borrará con su lista. ¿Seguro?")) return; const g=currentGroup(); await del("groups",g.id); S.gSel=""; render(); toast("Grupo eliminado"); },
  closeModalBg:(b,e)=>{ if(e.target===b) closeModal(); },
  fixSave:async()=>{ const o=S.fixOut; if(!o) return; await put("materials",{id:uid(),type:"retro",title:"Retro"+(o.alumnoName?": "+o.alumnoName:": "+(S.fix.tarea||"trabajo")).slice(0,100),topic:S.fix.tarea,groupName:o.alumnoName?o.alumnoName.split(" · ")[1]:"",content:fixAsMd(o),createdAt:Date.now()}); toast("Guardado en tu biblioteca"); },
  fixCopy:()=>{ const o=S.fixOut; if(o) copyText(o.retro_en+"\n\n"+o.retro_es); },
  fixToGrades:()=>{ const o=S.fixOut; if(!o||!o.alumnoKey) return; const [gid,sid]=o.alumnoKey.split("|"); const g=groupById(gid); const gr=gradesFor(gid);
    modal(`<div class="mhead"><h2>Pasar ${esc(o.calificacion)} a calificaciones</h2><button class="btn ghost" data-act="closeModal" aria-label="Cerrar">✕</button></div><div class="pad form"><p style="margin:0">${esc(o.alumnoName)}. ¿En qué rubro?</p><div class="row">${gr.cols.map(c=>`<button class="btn" data-act="fixPut" data-g="${esc(gid)}" data-s="${esc(sid)}" data-c="${esc(c.id)}">${esc(c.name)}</button>`).join("")}</div></div>`); },
  fixPut:async b=>{ const gr=JSON.parse(JSON.stringify(gradesFor(b.dataset.g))); gr.vals=gr.vals||{}; gr.vals[b.dataset.s]=gr.vals[b.dataset.s]||{}; gr.vals[b.dataset.s][b.dataset.c]=Math.round(+S.fixOut.calificacion*10)/10; await put("grades",gr); closeModal(); toast("Calificación registrada"); },
  chatSugg:b=>sendChat(b.textContent),
  chatClear:()=>{ S.chat=[]; render(); },
  chatCopy:b=>copyText(S.chat[+b.dataset.i].content),
  chatSave:async b=>{ const c=S.chat[+b.dataset.i]; if(!c) return; await put("materials",{id:uid(),type:"nota",title:titleFrom(c.content,(S.chat[+b.dataset.i-1]?.content||"Nota del asistente").slice(0,80)),content:c.content,createdAt:Date.now()}); toast("Guardado en tu biblioteca"); }
};
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b||b.disabled) return;
  if(b.closest("#stageRoot")) return;
  const fn=ACT[b.dataset.act]; if(fn){ if(b.tagName==="BUTTON"&&b.type!=="submit") e.preventDefault(); fn(b,e); }
});
async function addStudents(names,sort){
  const g=currentGroup(); let st=[...(g.students||[]),...names.map(n=>({id:uid(),name:n}))];
  if(sort) st.sort((a,b)=>a.name.localeCompare(b.name,"es"));
  await put("groups",Object.assign({},g,{students:st})); render(); toast(names.length===1?"Alumno agregado":names.length+" alumnos agregados");
}
function setAtt(a){ const i=S.attendance.findIndex(x=>x.id===a.id); if(i>=0) S.attendance[i]=a; else S.attendance.push(a); render(); later("att_"+a.id,()=>put("attendance",a),600); }

document.addEventListener("submit",e=>{
  const f=e.target; e.preventDefault();
  if(f.id==="genForm") generate();
  else if(f.id==="addStu"){ const n=$("#stuName").value.trim(); if(n) addStudents([n],false).then(()=>$("#stuName")?.focus()); }
  else if(f.id==="addCol"){ const n=$("#colName").value.trim(), w=+$("#colW").value||0; if(!n) return toast("Escribe el nombre del rubro."); const g=currentGroup(); const gr=JSON.parse(JSON.stringify(gradesFor(g.id))); gr.cols.push({id:"c"+uid().slice(0,6),name:n,w}); put("grades",gr).then(render); }
  else if(f.id==="ngForm"){ const n=$("#ng_name").value.trim(); if(!n) return; const g={id:"g"+uid().slice(0,10),name:n,grade:+$("#ng_grade").value||null,subject:$("#ng_subject").value.trim(),school:$("#ng_school").value.trim(),order:S.groups.length+1,students:[]}; put("groups",g).then(()=>{ closeModal(); S.gSel=g.id; S.gTab="alumnos"; go("grupos"); }); }
  else if(f.id==="fixForm") runFix();
  else if(f.id==="chatForm"){ const t=$("#chatIn"); if(!S.chatBusy) sendChat(t.value); }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.f){ S.form[t.dataset.f]=t.value; later("form",()=>ls.set("form",S.form),400); }
  else if(t.id==="libQ"){ S.libQ=t.value; later("lib",()=>{ const pos=t.selectionStart; render(); const n=$("#libQ"); if(n){ n.focus(); n.setSelectionRange(pos,pos);} },250); }
  else if(t.dataset.g){
    const [sid,cid]=t.dataset.g.split("|"); const g=currentGroup(); const gr=JSON.parse(JSON.stringify(gradesFor(g.id))); gr.vals=gr.vals||{}; gr.vals[sid]=gr.vals[sid]||{};
    const v=t.value.trim(); if(v==="") delete gr.vals[sid][cid]; else { let n=Math.max(0,Math.min(10,parseFloat(v))); if(!isNaN(n)) gr.vals[sid][cid]=n; }
    const i=S.grades.findIndex(x=>x.id===gr.id); if(i>=0) S.grades[i]=gr; else S.grades.push(gr);
    const av=avgFor(gr,sid), el=$("#avg_"+CSS.escape(sid)); if(el){ el.textContent=fmt1(av); el.className="avg "+avgClass(av); }
    later("gr_"+gr.id,()=>put("grades",gradesFor(g.id)),800);
  }
  else if(t.id&&t.id.startsWith("fx_")&&t.type!=="file"){ const k=t.id.slice(3); if(k in S.fix) S.fix[k]=t.value; }
  else if(t.id==="chatIn"){ t.style.height="auto"; t.style.height=Math.min(180,t.scrollHeight)+"px"; }
  else if(t.id==="fQ"){ S.fq=t.value; later("fq",()=>{ const pos=t.selectionStart; render(); const n=$("#fQ"); if(n){ n.focus(); n.setSelectionRange(pos,pos);} },250); }
  else if(t.id==="pickQ"){ const q=t.value.toLowerCase(); document.querySelectorAll("#pickList .pitem:not(.h)").forEach(el=>{ el.hidden=!!q&&!el.textContent.toLowerCase().includes(q); }); }
});
document.addEventListener("dragover",e=>{ if(S.view!=="archivos"||!canUpload()) return; if(![...(e.dataTransfer?.types||[])].includes("Files")) return; e.preventDefault(); $("#drop")?.classList.add("over"); });
document.addEventListener("dragleave",e=>{ if(!e.relatedTarget||e.target.id==="drop") $("#drop")?.classList.remove("over"); });
document.addEventListener("drop",e=>{ if(S.view!=="archivos"||!canUpload()||!e.dataTransfer?.files?.length) return; e.preventDefault(); $("#drop")?.classList.remove("over"); uploadFiles(e.dataTransfer.files); });
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.f==="grupo"){ const g=groupById(t.value); if(g&&g.subject){ S.form.materia=g.subject; const m=$('[data-f="materia"]'); if(m) m.value=g.subject; } }
  if(t.id==="attDate"){ S.attDate=t.value||todayISO(); render(); }
  if(t.id==="fx_rub"){ const r=S.materials.find(x=>x.id===t.value); if(r){ S.fix.criterios=r.content.slice(0,6000); const c=$("#fx_criterios"); if(c) c.value=S.fix.criterios; } }
  if(t.id==="fx_alumno"||t.id==="fx_nivel"){ S.fix[t.id.slice(3)]=t.value; }
  if(t.id==="fx_img"){ S.fix.img=t.files&&t.files[0]||null; }
  if(t.id==="upInput"){ const fl=[...(t.files||[])]; t.value=""; uploadFiles(fl); }
  if(t.id==="upCat"){ S.upCat=t.value; ls.set("upCat",S.upCat); }
  if(t.id==="upGrp"){ S.upGrp=t.value; }
  if(t.id==="fGrp"){ S.fgrp=t.value; render(); }
  if(t.id==="selMove"&&t.value){ moveFiles([...S.fsel],t.value); }
  if(t.id==="fMove"&&t.value){ const id=t.dataset.id; moveFiles([id],t.value).then(()=>openFile(id)); }
  if(t.id==="prCover"&&S.pr){ S.pr.cover=t.checked; }
  if(t.dataset.pk&&S.pr){ if(t.checked) S.pr.keys.add(t.dataset.pk); else S.pr.keys.delete(t.dataset.pk); prSync(); }
  if(t.dataset.pick&&S._pick){ const s=S._pick.sel; if(t.checked){ if(s.size>=6){ t.checked=false; toast("Máximo 6 materiales a la vez."); } else s.add(t.dataset.pick); } else s.delete(t.dataset.pick); }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape" && $("#modalRoot").innerHTML && !ST) closeModal();
  if(e.target.id==="chatIn" && e.key==="Enter" && !e.shiftKey){ e.preventDefault(); if(!S.chatBusy) sendChat(e.target.value); }
});

/* ================= capacidades ================= */
function setAiState(){
  const el=$("#aiState"); if(el) el.innerHTML = sample? '<span style="color:var(--leaf)">● IA conectada</span>' : '<span>○ IA no disponible aquí</span>';
  const h=$("#aiHint"); if(h) h.textContent = sample?"Generado por Claude con tu cuenta.":"La IA no está disponible en esta vista.";
}
localLoad(); render();
const C = window.claude;
if(C && C.use){
  C.use("db").then(d=>{ if(d) startDb(d); else { S.loaded=true; render(); } }).catch(()=>{});
  C.use("sample").then(s=>{ sample=s||null; setAiState(); if(S.view==="corregir") render(); if(s&&s.limits) s.limits().then(l=>{ const w=$("#fx_imgWrap"); S.canImg=!!(l&&l.images); S.imgMax=l&&l.images?l.images.maxCount:0; if(w) w.hidden=!S.canImg; }).catch(()=>{}); }).catch(()=>setAiState());
  C.use("downloads").then(d=>{ downloads=d||null; }).catch(()=>{});
  C.use("assets").then(a=>{ assets=a||null; if(S.view==="archivos") render(); refreshUsage(); }).catch(()=>{});
} else { setAiState(); }
})();
</script>
